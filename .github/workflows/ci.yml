name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify runs the full test suite, including the end-to-end tests that
      # exercise real git fixture repositories (git is preinstalled on the runner).
      - run: ./mvnw -B verify
