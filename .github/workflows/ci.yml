name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  review-annotations:
    # `> @claude …` remarks are working notes; none may reach main. See AGENT.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-review-markers.sh

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify runs the full test suite, including the end-to-end tests that
      # exercise real git fixture repositories (git is preinstalled on the runner).
      - run: ./mvnw -B verify

  # A native build for one platform, as a canary. Release day builds five of these; if
  # native-image can't compile this code (a missing reflection registration, a dependency
  # that doesn't survive AOT), that must fail on the pull request rather than at release
  # time. The release workflow handles the full matrix.
  native-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven
      - run: ./mvnw -B package -DskipTests -Dnative
      - name: The binary has to actually run
        run: |
          binary="$(ls target/diderot-*-runner)"
          "$binary" --version
          "$binary" --help

      # `--version` proves the image links; it does not prove sigstore works inside it. The first
      # real signed publish failed on a TUF root that native-image had left out of the binary,
      # because resources are not reachable by analysis. This reaches the same code: with no OIDC
      # token in the environment the signer cannot get an identity, but it has to get that far —
      # an error about a missing resource means the trust root did not make it into the image.
      - name: Signing has to get as far as asking for an identity
        run: |
          binary="$(ls target/diderot-*-runner)"
          mkdir -p /tmp/smoke-skill
          printf -- '---\nname: smoke\n---\nInstructions.\n' > /tmp/smoke-skill/SKILL.md
          set +e
          out="$(timeout 180 "$binary" push --sign /tmp/smoke-skill localhost:5000/skills/smoke:v1 2>&1)"
          set -e
          echo "$out"
          case "$out" in
            *"not found"*)
              echo "::error::a resource is missing from the native image: $out"; exit 1 ;;
            *oidc*|*Oidc*|*OIDC*|*identity*)
              echo "sigstore started up inside the native image and stopped at the identity, as expected" ;;
            *)
              echo "::error::unexpected failure before the identity step: $out"; exit 1 ;;
          esac
