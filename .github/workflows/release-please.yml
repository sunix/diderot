name: Release Please

# Maintains a "Release PR" that accumulates Conventional Commits changes landing on
# main. Merging that PR bumps the version, publishes a GitHub Release, creates a tag,
# and updates CHANGELOG.md.
#
# Requires commits reaching main to follow Conventional Commits:
#   feat:           → minor version bump
#   fix:            → patch version bump
#   feat!: / "BREAKING CHANGE:" footer → major version bump
#   chore:, docs:, ci:, etc. → no version bump (but still recorded in changelog)
#
# Optional: set the RELEASE_PLEASE_TOKEN secret to a Personal Access Token so that
# publishing a GitHub Release can trigger downstream workflows (e.g. the future
# native-binaries build listening on `release: published`). GitHub prevents the default
# GITHUB_TOKEN from triggering other workflows as an anti-loop safeguard. Falls back to
# GITHUB_TOKEN if the secret is not set.
on:
  push:
    branches:
      - main

# release-please needs to open/update PRs and create releases.
permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # maven strategy: keeps the pom.xml <version> in sync with releases.
          release-type: maven
