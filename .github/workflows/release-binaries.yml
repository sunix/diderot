name: Release binaries

# Builds a GraalVM native binary per platform plus one portable uber-jar, and attaches
# them to a GitHub Release so `install.sh` and JBang have something to download.
#
# Three ways in, because a Release created by release-please cannot trigger this by itself:
# GitHub's anti-loop safeguard blocks workflows started by the default GITHUB_TOKEN. So the
# release workflow calls this one inside its own run (workflow_call) rather than waiting for
# an event that never arrives. `release: published` still serves a Release a human creates,
# and workflow_dispatch is there to attach binaries to a tag after the fact.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and attach binaries to (e.g. v0.1.0)"
        required: true
        type: string
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach binaries to (e.g. v0.1.0)"
        required: true
      dry_run:
        description: "Build and check the binaries without attaching them to the release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Linux binaries are built inside Quarkus's builder image, not on the runner. A
          # native image links against the glibc it was built with, and ubuntu-latest ships 2.39 —
          # which refuses to start on Debian 11, Ubuntu 20.04 or RHEL 8 (issue #53). The UBI 8
          # builder has glibc 2.28, so one binary covers everything from Debian 10 upwards. The
          # image is multi-arch, so the same line serves both architectures.
          - runner: ubuntu-latest
            asset: linux-x86_64
            container_build: "true"
          - runner: ubuntu-24.04-arm
            asset: linux-aarch64
            container_build: "true"
          # macos-13 was retired in December 2025; macos-15-intel is the replacement
          # for x86_64 and the last Intel image GitHub plans to offer (until Aug 2027,
          # Apple having dropped the architecture). A retired label doesn't fail — the
          # job sits in `queued` forever, which is how this was found.
          - runner: macos-15-intel
            asset: darwin-x86_64
          - runner: macos-latest
            asset: darwin-aarch64
          - runner: windows-latest
            asset: windows-x86_64
            ext: .exe
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      # native-image needs several GB of RAM; every GitHub-hosted runner has enough,
      # which is the whole reason this build lives in CI and not on a laptop.
      - name: Build native binary
        shell: bash
        run: |
          if [ "${{ matrix.container_build }}" = "true" ]; then
            ./mvnw -B package -DskipTests -Dnative \
              -Dquarkus.native.container-build=true \
              -Dquarkus.native.builder-image=quay.io/quarkus/ubi-quarkus-mandrel-builder-image:jdk-21
          else
            ./mvnw -B package -DskipTests -Dnative
          fi

      # The compatibility claim, checked where it is made rather than reported by whoever it
      # breaks for: Debian 11 carries glibc 2.31, which is below what the old binaries needed.
      - name: The Linux binary has to run on an old glibc
        if: matrix.container_build == 'true'
        shell: bash
        run: |
          binary="$(ls target/diderot-*-runner)"
          echo "needs at most: $(objdump -T "$binary" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          docker run --rm -v "$PWD:/w" -w /w "debian:11" "./$binary" --version

      - name: Name and checksum the binary
        id: package
        shell: bash
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          src="$(ls target/diderot-*-runner${{ matrix.ext }})"
          name="diderot-${tag}-${{ matrix.asset }}${{ matrix.ext }}"
          mv "$src" "$name"
          # sha256sum on Linux, shasum on macOS; both emit "<hash>  <file>".
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"
          else shasum -a 256 "$name" > "$name.sha256"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Smoke test the binary
        shell: bash
        run: ./${{ steps.package.outputs.name }} --version

      - name: Attach to release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.package.outputs.name }}" "${{ steps.package.outputs.name }}.sha256" \
            --clobber

  # One JVM uber-jar, for JBang and for platforms with no native binary above.
  uberjar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build uber-jar
        run: ./mvnw -B package -DskipTests -Dquarkus.package.jar.type=uber-jar

      # Deliberately unversioned filename: it makes
      # releases/latest/download/diderot.jar a stable URL, which is what the JBang
      # catalog alias points at. The version still lives in the release tag / URL path.
      - name: Attach to release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.event.release.tag_name }}"
          mv target/*-runner.jar diderot.jar
          sha256sum diderot.jar > diderot.jar.sha256
          gh release upload "$tag" diderot.jar diderot.jar.sha256 --clobber
