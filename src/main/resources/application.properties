# CLI output hygiene: no banner, no log decoration on the console.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%s%e%n
# The ORAS SDK logs container-policy details at WARN on every request; keep the CLI quiet.
quarkus.log.category."land.oras".level=ERROR

# Two static initialisers capture SecureRandom state that must not be baked into the image heap:
# BouncyCastle's (the standard GraalVM remedy for BC), and Apache HttpClient's NTLM engine, whose
# RND_GEN static field the round-six build trace named explicitly - it rides in via
# google-http-client-apache-v2 and is never used here, NTLM being a Windows-auth scheme. The comma
# separates two complete arguments; a comma *inside* one argument is what an earlier attempt lost a
# flag to, the properties format unescaping `\,` before the list is split.
quarkus.native.additional-build-args=--initialize-at-run-time=org.bouncycastle,--initialize-at-run-time=org.apache.http.impl.auth.NTLMEngineImpl

# sigstore-java reads four files out of its own jar at run time: the TUF roots that bootstrap trust
# (public good and staging) and the Rekor entry schemas it validates log entries against. Resources
# are not reachable by analysis — nothing in the bytecode names them — so native-image leaves them
# out unless they are listed, and the binary fails at the first signature with
# "resource dev/sigstore/tuf/sigstore-tuf-root/root.json not found". The JVM build never notices,
# which is why this surfaced only on the first real signed publish.
quarkus.native.resources.includes=dev/sigstore/tuf/**/root.json,rekor/model/**/*.json
