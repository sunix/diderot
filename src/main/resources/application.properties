# CLI output hygiene: no banner, no log decoration on the console.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%s%e%n
# The ORAS SDK logs container-policy details at WARN on every request; keep the CLI quiet.
quarkus.log.category."land.oras".level=ERROR

# sigstore's TUF client reaches commons-logging, which ships an adapter per logging backend —
# Log4JLogger, Log4jApiLogFactory, and friends — each referencing classes that are not on the
# classpath. native-image initialises them at build time and aborts, e.g. with
# NoClassDefFoundError: org/apache/log4j/Priority. Naming them one at a time costs a build per
# adapter, so the whole package is deferred to run time, where none of them is ever selected because
# no backend is present.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.logging.impl
