# CLI output hygiene: no banner, no log decoration on the console.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%s%e%n
# The ORAS SDK logs container-policy details at WARN on every request; keep the CLI quiet.
quarkus.log.category."land.oras".level=ERROR

# BouncyCastle's static initialisers capture SecureRandom state that must not be baked into the
# image heap - the standard GraalVM remedy is to initialise it at run time. Single argument on
# purpose: a comma inside this property is a list separator (an escaped one is unescaped by the
# properties format first and then split on anyway, which is how a second argument silently
# vanished from an earlier attempt).
quarkus.native.additional-build-args=--initialize-at-run-time=org.bouncycastle
