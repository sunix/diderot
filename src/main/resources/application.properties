# CLI output hygiene: no banner, no log decoration on the console.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%s%e%n
# The ORAS SDK logs container-policy details at WARN on every request; keep the CLI quiet.
quarkus.log.category."land.oras".level=ERROR

# sigstore's TUF client reaches commons-logging, whose Log4JLogger adapter references log4j classes
# that are not on the classpath. native-image initialises it at build time and aborts with
# NoClassDefFoundError: org/apache/log4j/Priority — so defer that one class to run time, where it is
# never reached because there is no log4j to select. GraalVM names this fix in the abort message.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.commons.logging.impl.Log4JLogger
