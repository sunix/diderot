# CLI output hygiene: no banner, no log decoration on the console.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%s%e%n
# The ORAS SDK logs container-policy details at WARN on every request; keep the CLI quiet.
quarkus.log.category."land.oras".level=ERROR

# Two static initialisers capture SecureRandom state that must not be baked into the image heap:
# BouncyCastle's (the standard GraalVM remedy for BC), and Apache HttpClient's NTLM engine, whose
# RND_GEN static field the round-six build trace named explicitly - it rides in via
# google-http-client-apache-v2 and is never used here, NTLM being a Windows-auth scheme. The comma
# separates two complete arguments; a comma *inside* one argument is what an earlier attempt lost a
# flag to, the properties format unescaping `\,` before the list is split.
# Only Apache HttpClient's NTLM engine is deferred now. Part seven also deferred the whole of
# org.bouncycastle, which was the hand-rolled remedy for its SecureRandom landing in the image heap;
# that rule now collides with the line below, since registering a provider means instantiating it
# while the image is built. Quarkus's BouncyCastle support defers the few BC classes that actually
# need it, so the package-wide rule can go.
# The second argument is grpc-netty's own static state: registering its channel provider makes
# native-image initialise the class while building, and its static allocator is a netty
# PooledByteBufAllocator — a type Quarkus defers to run time, so the build stops on an object that
# cannot be in the image heap. Deferring the package that holds it puts both on the same side.
quarkus.native.additional-build-args=--initialize-at-run-time=org.apache.http.impl.auth.NTLMEngineImpl,--initialize-at-run-time=io.grpc.netty

# sigstore-java reads four files out of its own jar at run time: the TUF roots that bootstrap trust
# (public good and staging) and the Rekor entry schemas it validates log entries against. Resources
# are not reachable by analysis — nothing in the bytecode names them — so native-image leaves them
# out unless they are listed, and the binary fails at the first signature with
# "resource dev/sigstore/tuf/sigstore-tuf-root/root.json not found". The JVM build never notices,
# which is why this surfaced only on the first real signed publish.

# sigstore-java registers BouncyCastle the way a library does on a JVM — Security.addProvider in a
# static initialiser — which a native image ignores: providers, and the algorithm classes they load
# by name, have to be known when the image is built. Hand-rolling that is two GraalVM options and
# then a long tail of "class configured for KeyFactory (provider: BC) cannot be found". This line,
# with the quarkus-security extension that owns it, is the documented route and registers both.
quarkus.security.security-providers=BC

# gRPC picks its transport through ServiceLoader, and sigstore talks to Fulcio over gRPC. Service
# files are the third kind of thing analysis cannot follow — after resources and reflection — so
# the lookup finds nothing and the client reports "No functional channel service provider found.
# Try adding a dependency on grpc-netty", while the dependency is right there.
#
# Registering *every* provider on the classpath (auto-service-loader-registration) was tried first
# and broke the build instead: it initialises providers whose static state drags netty's
# PooledByteBufAllocator into the image heap. So the service files are shipped as resources, and
# the three classes a client actually needs — a transport, a name resolver, a load balancer — are
# registered for reflection next door in SigstoreProtoReflection.
quarkus.native.resources.includes=dev/sigstore/tuf/**/root.json,rekor/model/**/*.json,META-INF/services/io.grpc.*
