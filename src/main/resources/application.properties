# CLI output hygiene: no banner, no log decoration on the console.
quarkus.banner.enabled=false
quarkus.log.level=WARN
quarkus.log.console.format=%s%e%n
# The ORAS SDK logs container-policy details at WARN on every request; keep the CLI quiet.
quarkus.log.category."land.oras".level=ERROR

# Quarkus initialises classes at build time by default. Two namespaces in sigstore-java's tree
# cannot be: grpc's *shaded* netty (the Quarkus netty extension tames the real one, but the shaded
# copy lives under another name it never sees - ByteBufUtil's static init probes logging backends
# and trips over absent log4j2 classes), and BouncyCastle, whose static init captures SecureRandom
# state that must not be baked into the image heap. Both are the standard GraalVM remedies for
# these libraries; neither ships its own native-image config (checked, not assumed).
quarkus.native.additional-build-args=\
    --initialize-at-run-time=io.grpc.netty.shaded.io.netty\,org.bouncycastle

